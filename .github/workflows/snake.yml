# ═══════════════════════════════════════════════════════════════
#  SNAKE CONTRIBUTION ANIMATION
#  Gera as SVGs da cobrinha e publica na branch "output"
#  Caminho obrigatório: .github/workflows/snake.yml
# ═══════════════════════════════════════════════════════════════
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: theeussx
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#4F46E5
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0B1024,#1E1B4B,#312E81,#4F46E5,#6366F1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
